# Pinned so the Compose project name never drifts from the folder name
# ("affiliate marketplace" — the space gets sanitized differently across
# Compose versions). This keeps `docker compose` bound to the existing
# containers/volume (affiliatemarketplace_db_data) instead of creating a
# second, empty stack that collides on port 5433.
name: affiliatemarketplace

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: affiliate_marketplace
      POSTGRES_PASSWORD: affiliate_marketplace
      POSTGRES_DB: affiliate_marketplace
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliate_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local SMTP catcher for dev — nothing sent through it leaves
  # the machine. Inbox UI at http://localhost:8025. Point
  # lib/mailer.ts's SMTP_* env vars at this locally; production
  # should use a real provider.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:

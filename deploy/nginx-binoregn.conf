# nginx site for binoregn.com (Contabo VPS, see doc/deploy.md).
# Installed at /etc/nginx/sites-available/binoregn and symlinked into
# sites-enabled. Certbot adds the HTTPS (443) server block and the
# http→https redirect to this file when the certificate is issued.
# After certbot, the HTTPS block also gets (first line after `listen 443`):
#   if ($host = www.binoregn.com) { return 301 https://binoregn.com$request_uri; }
# so every visit ends on https://binoregn.com — one cookie domain, which
# Google sign-in needs (otherwise: "pkceCodeVerifier could not be parsed").
server {
    listen 80;
    listen [::]:80;
    server_name binoregn.com www.binoregn.com;

    # Product image uploads go through the app (/api/admin/uploads).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js build assets are content-hashed — cache them hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
